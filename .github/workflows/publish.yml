name: Publish to npm

# Manual only: someone runs it from the Actions tab, on main, with the version to publish. It never
# runs by itself on a push, a tag, a release or a merge.
# Trusted publishing (OIDC): npm trades this job's OIDC token for a short-lived publish credential,
# so there is no npm token for this repository to hold. Only the `publish` job gets `id-token`, and
# it waits in the `npm` environment until a reviewer approves it under "Review deployments".
# src/publish-workflow.test.ts fails if any of that stops being true.
#
# ⚠️ Corrected 2026-09-30: this header used to say the package was not on npm and no token was set.
# Both were false. 0.1.0 to 0.4.1 went out from this file, each on a v* tag, with a stored token.
#
# Left to the owner, on GitHub and npmjs.com, never from a PR. Until step 3 exists, a dispatch fails
# at Publish and nothing is published, which is the point.
#   1. Environment `npm`: required reviewer UltravioletaDAO, prevent self-review, deployments from
#      main only, no bypass. Create it before the first dispatch; otherwise GitHub creates it on the
#      fly, with no reviewer.
#   2. A ruleset on main.
#   3. `npm trust` for uvd-describe-sdk: UltravioletaDAO/uvd-describe-sdk-typescript, publish.yml,
#      environment npm, with token publishing disallowed.
#   4. Only then: delete the npm token stored in this repository and revoke it on npmjs.com.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must equal package.json"
        required: true
        type: string

permissions:
  contents: read # the job that publishes adds id-token itself

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check version and tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions pinned by commit SHA, not tag: a mutable tag lets whoever controls the action repo
      # change what runs inside the workflow that publishes. Refresh deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: The input version must be the package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$INPUT_VERSION" != "$pkg" ]; then
            echo "::error::input $INPUT_VERSION, package.json $pkg"
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      # Offline, like in ci.yml: the suite never touches the network.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package smoke test
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # trusted publishing (OIDC) and provenance, only in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm must support trusted publishing (>= 11.5.1)
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) cannot publish with OIDC"; exit 1; }

      - run: npm ci --ignore-scripts

      # npm exchanges this job's OIDC token for a short-lived publish credential, which works only
      # while npmjs.com lists this repository and publish.yml as the package's trusted publisher.
      # There is no token to add here. prepublishOnly re-runs the gates and builds dist/ first.
      - name: Publish
        run: npm publish --provenance --access public

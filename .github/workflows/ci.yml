name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Offline. The suite never touches the network — a test that goes red
      # because someone's wifi dropped teaches people to ignore red.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package smoke test
        run: npm pack --dry-run

      # The whole dependency argument of this package, asserted rather than
      # promised: a free-only consumer installs nothing. If a stray runtime
      # import of `uvd-x402-sdk` (or anything else) ever lands in `index` or
      # `x402`, this fails.
      #
      # ⚠️ Extended 2026-08-30 for the partner rail, and it did NOT become an
      # exemption. `partner/index` is the one entry that genuinely needs the
      # payment SDK at runtime — it calls its ERC-8128 signer — so instead of
      # being skipped it declares the EXACT set it may import. For that file
      # this is stricter than the rule it replaces, not looser: a SECOND import
      # landing there (ethers, or a bundled copy of the SDK) fails as loudly as
      # one landing in `index`, and so does the import DISAPPEARING, which is
      # what bundling the dependency instead of externalising it looks like.
      - name: Each built entry imports exactly what it is allowed to
        run: |
          node -e "
          const {readFileSync}=require('fs');
          const ALLOWED={'index':[],'x402/index':[],'partner/index':['uvd-x402-sdk/erc8128']};
          let bad=false;
          for (const [entry, allowed] of Object.entries(ALLOWED)) {
            const cjs=[...readFileSync('dist/'+entry+'.js','utf8').matchAll(/require\(['\"]([^'\"]+)['\"]\)/g)].map(m=>m[1]);
            const esm=[...readFileSync('dist/'+entry+'.mjs','utf8').matchAll(/^\s*import[^;]*?from\s*['\"]([^'\"]+)['\"]/gm)].map(m=>m[1]);
            for (const [kind, found] of [['cjs',cjs],['esm',esm]]) {
              const extra=found.filter(x=>!allowed.includes(x));
              if (extra.length) { console.error('FAIL', entry, kind, 'imports', extra); bad=true; }
              const missing=allowed.filter(x=>!found.includes(x));
              if (missing.length) { console.error('FAIL', entry, kind, 'no longer imports', missing, '- bundled instead of external?'); bad=true; }
            }
          }
          if (bad) process.exit(1);
          console.log('OK: every entry imports exactly its declared set');
          "

  # Does the SERVER still look like what our hand-written types say?
  #
  # Separate job, and NOT part of `validate`, because it is the only thing here
  # that touches the network: a red here means describe.net moved, which is a
  # different conversation from "this PR broke something". Scheduled as well as
  # on push, because the server can move while nobody is pushing.
  schema-drift:
    name: Live schema still matches the snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare schema/openapi.snapshot.json against the live API
        run: npm run schema:check
